<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="An interactive particle logo demo with green cubes, pointer attraction, and click ripples." />
    <title>t · Particle logo</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <a class="wordmark" href="./" aria-label="Particle logo demo"><span class="brand-square"></span>t</a>
        <nav class="header-links" aria-label="Demo links">
          <a class="source-link header-link" href="./logo.svg" download="logo.svg">Download SVG <span aria-hidden="true">↗</span></a>
          <a class="github-link header-link" href="https://github.com/techbarsw/tb-web-anim" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </header>
      <main>
        <figure class="demo" aria-label="Green rounded cubes flowing into a lowercase t and a separate square">
          <div id="animation" class="stage">
            <img class="initial-mark" src="./logo.svg" alt="" aria-hidden="true" style="opacity:0" />
            <noscript><style>.initial-mark { opacity: .85 !important; }</style><p class="no-script">Enable JavaScript to see the particles move.</p></noscript>
          </div>
          <figcaption class="demo-controls">
            <div class="state"><span class="status-dot" aria-hidden="true"></span><span id="phase-label">Flowing</span><span class="state-separator" aria-hidden="true">/</span><span id="particle-label">Live particles</span></div>
            <p id="interaction-hint" class="interaction-hint" hidden></p>
            <div class="buttons">
              <button id="pause" type="button" disabled aria-label="Pause animation"><svg class="pause-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M11 3v10" /></svg><span>Pause</span></button>
              <button id="replay" type="button" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6a5.3 5.3 0 1 1-.2 4M3 2v4h4" /></svg><span>Replay</span></button>
            </div>
          </figcaption>
        </figure>
      </main>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
